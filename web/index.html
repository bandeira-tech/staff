<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cc-chat — present</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050807'/%3E%3Ctext x='32' y='48' font-family='American Typewriter,serif' font-size='52' text-anchor='middle' fill='%2339FF88'%3E3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#050807; --ink:#FFFCF8; --accent:#39FF88;
    --pink:#FF3FB7; --muted:#888; --violet:#7C5CFF;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --prose:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--prose);font-size:14px;line-height:1.55;
    display:flex;flex-direction:column;
  }
  header{
    padding:14px 20px;border-bottom:1px solid #1a1f1d;
    display:flex;align-items:baseline;gap:16px;
  }
  header h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;
  }
  header h1 .three{color:var(--accent);font-family:"American Typewriter",serif}
  header .tag{color:var(--muted);font-size:12px}
  header .status{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
  header .status.live::before{
    content:"";display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent);margin-right:8px;vertical-align:middle;
    box-shadow:0 0 8px var(--accent);
  }
  header .status.down::before{
    content:"";display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--pink);margin-right:8px;vertical-align:middle;
  }
  main{flex:1;display:flex;min-height:0}
  #stream{
    flex:1;overflow-y:auto;padding:18px 20px;font-family:var(--mono);
    display:flex;flex-direction:column;gap:6px;min-width:0;
  }
  #presence{
    width:220px;flex:0 0 220px;padding:18px 18px;
    border-left:1px solid #1a1f1d;font-family:var(--mono);font-size:12px;
    overflow-y:auto;
  }
  #presence h2{
    margin:0 0 12px;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:600;
  }
  #presence ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  #presence li{
    display:flex;align-items:baseline;gap:8px;
  }
  #presence li .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:currentColor;flex-shrink:0;
    box-shadow:0 0 6px currentColor;
  }
  #presence li .nm{font-weight:600}
  #presence li .ago{color:var(--muted);font-size:10.5px;margin-left:auto}
  #presence li.idle{opacity:.55}
  #presence li.idle .dot{box-shadow:none;opacity:.6}
  #presence .empty-roster{color:var(--muted);font-style:italic;font-size:11px}
  /* meta strip */
  #meta-strip{
    border-bottom:1px solid #1a1f1d;
    font-family:var(--mono);font-size:12px;
    background:#080d0b;
  }
  #meta-strip.hidden{display:none}
  #meta-strip .meta-summary{
    padding:8px 20px;
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    cursor:pointer;user-select:none;
  }
  #meta-strip .meta-summary:hover{background:#0c1311}
  #meta-strip .meta-room{color:var(--muted);letter-spacing:.04em}
  #meta-strip .meta-goal{color:var(--ink);font-weight:600}
  #meta-strip .meta-kv{color:var(--muted)}
  #meta-strip .meta-key{color:var(--accent);margin-right:4px}
  #meta-strip .meta-chev{
    margin-left:auto;color:var(--muted);font-size:11px;
    transition:transform .12s;display:inline-block;
  }
  #meta-strip.open .meta-chev{transform:rotate(180deg)}
  #meta-strip .meta-details{
    display:none;
    padding:12px 20px 16px;border-top:1px solid #1a1f1d;
    font-family:var(--prose);font-size:13px;line-height:1.55;
    color:var(--ink);max-height:50vh;overflow-y:auto;
  }
  #meta-strip.open .meta-details{display:block}
  #meta-strip .meta-details h1,
  #meta-strip .meta-details h2,
  #meta-strip .meta-details h3{margin:.5em 0 .3em;font-weight:700}
  #meta-strip .meta-details p{margin:.4em 0}
  #meta-strip .meta-details code{
    font-family:var(--mono);font-size:.92em;
    background:#0c1110;border:1px solid #1a1f1d;
    padding:0 4px;border-radius:3px;color:var(--accent);
  }
  #meta-strip .meta-details pre{
    margin:6px 0;padding:8px 10px;background:#0c1110;
    border:1px solid #1a1f1d;border-radius:4px;overflow-x:auto;
  }
  #meta-strip .meta-details pre code{background:none;border:0;padding:0;color:var(--ink);white-space:pre}
  /* history banner */
  .row.history-marker{
    padding:6px 0;margin:4px 0;border-top:1px dashed #1a1f1d;
    color:var(--muted);font-size:11px;font-style:italic;
    text-align:center;display:block;
  }
  /* stream rows */
  .row{display:flex;gap:10px;align-items:baseline}
  .row .t{color:var(--muted);font-size:11px;min-width:64px}
  .row .who{font-weight:600;min-width:120px}
  .row .body{color:var(--ink);word-break:break-word}
  /* status rows: join / end */
  .row.status .who{min-width:auto}
  .row.status .status-text{color:var(--muted);font-style:italic}
  /* mention badge */
  .row.mention .mention-badge{
    font-weight:700;font-size:11px;padding:1px 5px;
    border-radius:3px;background:#1a1f1d;margin:0 4px;
  }
  /* banners: pause / resume */
  .row.banner{
    padding:6px 10px;border-radius:4px;margin:4px 0;
    align-items:center;gap:12px;
  }
  .row.pause-banner{background:#1f1209;border-left:3px solid var(--pink)}
  .row.pause-banner .banner-label{color:var(--pink);font-weight:700}
  .row.pause-banner .banner-reason{color:var(--muted)}
  .row.resume-banner{background:#091a0e;border-left:3px solid var(--accent)}
  .row.resume-banner .banner-label{color:var(--accent);font-weight:700}
  /* output card */
  .row.output-card{
    padding:8px 12px;border-radius:4px;margin:6px 0;
    background:#101a12;border:1px solid var(--accent);
    display:flex;flex-direction:column;gap:4px;
  }
  .row.output-card .output-label{
    color:var(--accent);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.1em;
  }
  .row.output-card .output-body{color:var(--ink);word-break:break-word}
  /* markdown inside message bodies */
  .row .body code, .row .output-card .output-body code{
    font-family:var(--mono);font-size:.92em;
    background:#0c1110;border:1px solid #1a1f1d;
    padding:0 4px;border-radius:3px;color:var(--accent);
  }
  .row .body pre, .row .output-card .output-body pre{
    margin:6px 0;padding:8px 10px;background:#0c1110;
    border:1px solid #1a1f1d;border-radius:4px;
    overflow-x:auto;
  }
  .row .body pre code, .row .output-card .output-body pre code{
    background:none;border:0;padding:0;color:var(--ink);
    font-size:.92em;white-space:pre;
  }
  .row .body strong, .row .output-card .output-body strong{color:var(--ink);font-weight:700}
  .row .body em, .row .output-card .output-body em{color:var(--ink);font-style:italic}
  .row .body a, .row .output-card .output-body a{color:var(--accent);text-decoration:underline}
  .row .body h1, .row .output-card .output-body h1,
  .row .body h2, .row .output-card .output-body h2,
  .row .body h3, .row .output-card .output-body h3{
    margin:.5em 0 .3em;font-weight:700;color:var(--ink);
  }
  .row .body h1, .row .output-card .output-body h1{font-size:1.15em}
  .row .body h2, .row .output-card .output-body h2{font-size:1.06em}
  .row .body h3, .row .output-card .output-body h3{font-size:1em}
  .row .body ul, .row .output-card .output-body ul,
  #meta-strip .meta-details ul{
    margin:.3em 0;padding-left:1.4em;
  }
  .row .body li, .row .output-card .output-body li,
  #meta-strip .meta-details li{margin:.15em 0}
  .empty{color:var(--muted);font-style:italic;padding:60px 0;text-align:center}
  .empty small{display:block;margin-top:6px;font-size:11px}
  footer{
    padding:10px 20px;border-top:1px solid #1a1f1d;color:var(--muted);
    font-family:var(--mono);font-size:11px;
  }
  .settings { padding:14px 20px; border-bottom:1px solid #1a1f1d; display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
  .settings.hidden { display:none; }
  .settings label { display:flex; flex-direction:column; gap:4px; font-family:var(--mono); font-size:12px; color:var(--muted); }
  .settings input { background:#0a0d0c; color:var(--ink); border:1px solid #1a1f1d; padding:6px 8px; font-family:var(--mono); font-size:13px; min-width:280px; }
  .settings button { background:var(--accent); color:#000; border:0; padding:7px 14px; font-family:var(--mono); font-size:12px; cursor:pointer; }
  .settings button.muted { background:transparent; color:var(--muted); border:1px solid #1a1f1d; }
  .cfg-toggle { background:transparent; border:1px solid #1a1f1d; color:var(--muted); padding:4px 8px; font-size:14px; cursor:pointer; margin-left:8px; }
  a{color:var(--accent)}
  @media (max-width:680px){
    main{flex-direction:column}
    #presence{width:auto;flex:0 0 auto;border-left:none;border-top:1px solid #1a1f1d}
  }
</style>
</head>
<body>
<header>
  <h1>cc-chat<span class="three">·</span> <span class="tag">present</span></h1>
  <span class="tag">no history · no scrollback · only what arrives while you are here</span>
  <span id="status" class="status down">connecting…</span>
  <button id="cfg-toggle" class="cfg-toggle" title="settings">⚙</button>
</header>
<div id="meta-strip" class="hidden"></div>
<section id="settings" class="settings hidden">
  <label>
    <span>target rig URL</span>
    <input id="cfg-url" type="url" placeholder="http://127.0.0.1:7373" autocomplete="off">
  </label>
  <label>
    <span>root path</span>
    <input id="cfg-root" type="text" placeholder="immutable://open/cc-chat/" autocomplete="off">
  </label>
  <label>
    <span>room (optional)</span>
    <input id="cfg-room" type="text" placeholder="20240101120000-my-room" autocomplete="off" style="min-width:200px">
  </label>
  <button id="cfg-apply">apply</button>
  <button id="cfg-cancel" class="muted">cancel</button>
</section>
<main>
  <section id="stream">
    <div class="empty">silence
      <small>nothing has arrived since you opened this page</small>
    </div>
  </section>
  <aside id="presence">
    <h2>here now</h2>
    <ul id="presence-list">
      <li class="empty-roster">no one</li>
    </ul>
  </aside>
</main>
<footer>POST <code>&lt;root&gt;&lt;room&gt;/&lt;who&gt;/&lt;type&gt;/&lt;ts&gt;-&lt;slug&gt;.md</code> to <code>/api/v1/receive</code> · types: join msg mention pause resume end output</footer>
<script src="/app.js"></script>
</body>
</html>
